# sound.cfg
#
# Configuration file for the Angband sound events
#
# The format is:
# <event name> = <sample-names seperated by spaces>
#
# Example:
# hit = hit.wav hit1.wav
#
# Look at the definition of "angband_sound_name" in variable.c for a complete list of
# all the available event names.

[Sound]
hit = hit.wav drop.wav hit1.wav
miss = miss.wav miss1.wav
flee = flee.wav
drop = clunk.wav
kill = kill.wav destroy.wav kill1.wav
level = level.wav 
death = death.wav
study = 
teleport = plm_chimes_jangle.wav
shoot = plc_miss_swish.wav plc_miss_arrow.wav
quaff = plm_bottle_clinks.wav plm_cork_pop.wav plm_cork_squeak.wav
zap = plm_zap_rod.wav
walk = 
tpother = plm_chimes_jangle.wav
hitwall = plm_wood_thud.wav
eat = eat.wav
store1 = money.wav
store2 = money.wav
store3 = money.wav
store4 = money.wav
dig = thump.wav
opendoor = opendoor.wav
shutdoor = shutdoor.wav
tplevel = sum_bell_crystal.wav

# RVIP: events without a Sil-Q sample use the Dubtrain Angband Sound Pack v3.1.0;
# the last ones are sound-only events added by the RVIP port (SOUND_MON_HIT ...).
bell = plm_jar_ding.wav
